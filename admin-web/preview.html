            return {
              ...o,
              status: approved ? 'confirmed' : 'cancelled',
            };

          return o;

        setViewingReceiptOrder(null);

        setProducts(prev => prev.map(p => p.id === prodId ? { ...p, available: !p.available } : p));

      };

        setProducts(prev => prev.map(p => p.id === prodId ? { ...p, stock: Math.max(0, val) } : p));

                              <td className="py-3 font-mono font-bold">#{order.id.slice(-5)}</td>
                              <td className="py-3 font-semibold">{order.customer.fullName}</td>
                              <td className="py-3">{lines.map(l => `${l.quantity}x ${l.name}`).join(', ')}</td>
                              <td className="py-3 font-bold text-[#C95F72]">{formatKz(sub)}</td>
                              <td className="py-3"><OrderBadge status={order.status} /></td>
                              <td className="py-3 text-right">
                                {order.status === 'confirmed' && (
                                  <button onClick={() => handleUpdateOrderStatus(order.id, 'preparing')} className="bg-[#E98A9A] text-white px-2.5 py-1 rounded-lg text-xs font-bold">
                                    Preparar
                                  </button>
                                )}
                                {order.status === 'preparing' && (
                                  <button onClick={() => handleUpdateOrderStatus(order.id, 'shipped')} className="bg-[#7C3AED] text-white px-2.5 py-1 rounded-lg text-xs font-bold">
                                    Enviar
                                  </button>
                                )}
                                {order.status === 'shipped' && (
                                  <button onClick={() => handleUpdateOrderStatus(order.id, 'delivered')} className="bg-[#286744] text-white px-2.5 py-1 rounded-lg text-xs font-bold">
                                    Entregue
                                  </button>
                                )}
                              </td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}

              {/* MERCHANT: PRODUCTS */}
              {currentTab === 'merchant-products' && (
                <div className="bg-white rounded-2xl border border-[#F0E5E8] p-6 space-y-4">
                  <div className="flex justify-between items-center pb-4 border-b border-[#F0E5E8]">
                    <h2 className="text-lg font-bold text-[#252225]">Os Meus Produtos · {currentStore.name}</h2>
                    <button
                      onClick={() => setProductModalOpen(true)}
                      className="bg-[#E98A9A] hover:bg-[#C95F72] text-white px-4 py-2 rounded-xl text-xs font-bold"
                    >
                      + Publicar Nova Peça
                    </button>
                  </div>

                  <table className="w-full text-left text-xs">
                    <thead>
                      <tr className="border-b border-[#F0E5E8] text-[#777277] text-[11px] uppercase font-bold">
                        <th className="pb-3">Peça</th>
                        <th className="pb-3">Condição</th>
                        <th className="pb-3">Preço</th>
                        <th className="pb-3">Stock</th>
                        <th className="pb-3">Tamanhos</th>
                        <th className="pb-3 text-right">Ação</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-[#F0E5E8]">
                      {products.filter(p => p.merchantId === activeStoreId).map(prod => (
                        <tr key={prod.id} className="hover:bg-[#FFF8FA]">
                          <td className="py-3 flex items-center gap-3">
                            <img src={prod.image} className="w-10 h-12 rounded-lg object-cover" />
                            <span className="font-bold text-[#252225]">{prod.name}</span>
                          </td>
                          <td className="py-3"><ConditionBadge condition={prod.condition} /></td>
                          <td className="py-3 font-bold text-[#C95F72]">{formatKz(prod.price)}</td>
                          <td className="py-3">
                            <input
                              type="number"
                              min="0"
                              value={prod.stock}
                              onChange={(e) => handleUpdateStock(prod.id, Number(e.target.value))}
                              className="w-14 px-2 py-1 border rounded font-bold text-center"
                            />
                          </td>
                          <td className="py-3">{prod.sizes.join(', ')}</td>
                          <td className="py-3 text-right">
                            <button
                              onClick={() => handleToggleProduct(prod.id)}
                              className={`px-3 py-1 rounded-lg font-bold text-xs ${prod.available ? 'bg-[#E5F3EA] text-[#286744]' : 'bg-gray-100 text-gray-400'}`}
                            >
                              {prod.available ? 'Ativo' : 'Pausado'}
                            </button>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              )}

              {/* MERCHANT: ORDERS */}
              {currentTab === 'merchant-orders' && (
                <div className="bg-white rounded-2xl border border-[#F0E5E8] p-6 space-y-4">
                  <h2 className="text-lg font-bold text-[#252225]">Encomendas dos Clientes</h2>
                  <div className="space-y-4">
                    {merchantOrders.map(order => {
                      const lines = order.lines.filter(l => l.merchantId === activeStoreId);
                      const sub = lines.reduce((s, l) => s + l.unitPrice * l.quantity, 0);

                      return (
                        <div key={order.id} className="p-4 rounded-2xl border border-[#F0E5E8] bg-[#FFF8FA]/40 space-y-3">
                          <div className="flex justify-between items-center">
                            <div>
                              <span className="font-mono font-bold text-xs">#{order.id.slice(-5)}</span>
                              <span className="text-xs text-[#777277] ml-2">Cliente: <strong className="text-[#252225]">{order.customer.fullName} ({order.customer.phone})</strong></span>
                            </div>
                            <OrderBadge status={order.status} />
                          </div>

                          <div className="text-xs bg-white p-3 rounded-xl border border-[#F0E5E8]">
                            <div className="font-semibold text-[#252225]">Endereço de Entrega:</div>
                            <p className="text-[#777277]">{order.customer.address}, {order.customer.municipality}, {order.customer.province}</p>
                            {order.customer.reference && <p className="text-[#C95F72] text-[11px]">Ref: {order.customer.reference}</p>}
                          </div>

                          <div className="flex justify-between items-center text-xs">
                            <div>
                              <span className="text-[#777277]">Itens comprados: </span>
                              <span className="font-bold text-[#252225]">{lines.map(l => `${l.quantity}x ${l.name} (${l.size})`).join(' · ')}</span>
                            </div>
                            <span className="text-sm font-bold text-[#C95F72]">{formatKz(sub)}</span>
                          </div>

                          <div className="pt-2 border-t border-[#F0E5E8] flex justify-end gap-2">
                            {order.status === 'confirmed' && (
                              <button onClick={() => handleUpdateOrderStatus(order.id, 'preparing')} className="bg-[#E98A9A] text-white px-3 py-1.5 rounded-xl font-bold text-xs">
                                Iniciar Preparação
                              </button>
                            )}
                            {order.status === 'preparing' && (
                              <button onClick={() => handleUpdateOrderStatus(order.id, 'shipped')} className="bg-[#7C3AED] text-white px-3 py-1.5 rounded-xl font-bold text-xs">
                                Fazer Envio / A Caminho
                              </button>
                            )}
                            {order.status === 'shipped' && (
                              <button onClick={() => handleUpdateOrderStatus(order.id, 'delivered')} className="bg-[#286744] text-white px-3 py-1.5 rounded-xl font-bold text-xs">
                                Confirmar Entrega
                              </button>
                            )}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              )}

              {/* MERCHANT: SALES */}
              {currentTab === 'merchant-sales' && (
                <div className="space-y-6">
                  <div className="bg-white rounded-2xl border border-[#F0E5E8] p-6">
                    <h2 className="text-lg font-bold text-[#252225]">Extrato Financeiro & Repasses</h2>
                    <p className="text-xs text-[#777277] mt-1">Conta de Repasse: {currentStore.bankName} - {currentStore.iban}</p>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                    <div className="bg-white rounded-2xl border border-[#F0E5E8] p-5">
                      <span className="text-xs font-medium text-[#777277]">Bruto em Vendas</span>
                      <div className="text-2xl font-bold text-[#252225] mt-1">
                        {formatKz(currentStore.totalSales)}
                      </div>
                    </div>
                    <div className="bg-white rounded-2xl border border-[#F0E5E8] p-5">
                      <span className="text-xs font-medium text-[#777277]">Comissão Plataforma ({currentStore.commissionRate}%)</span>
                      <div className="text-2xl font-bold text-[#777277] mt-1">
                        {formatKz(Math.round(currentStore.totalSales * (currentStore.commissionRate / 100)))}
                      </div>
                    </div>
                    <div className="bg-white rounded-2xl border border-[#F0E5E8] p-5">
                      <span className="text-xs font-medium text-[#777277]">Líquido a Receber</span>
                      <div className="text-2xl font-bold text-[#4FA982] mt-1">
                        {formatKz(Math.round(currentStore.totalSales * (1 - currentStore.commissionRate / 100)))}
                      </div>
                    </div>
                  </div>
                </div>
              )}

              {/* MERCHANT: PROFILE */}
              {currentTab === 'merchant-profile' && (
                <div className="bg-white rounded-2xl border border-[#F0E5E8] p-6 space-y-4 max-w-2xl mx-auto">
                  <h2 className="text-lg font-bold text-[#252225]">Configurações da Loja & IBAN</h2>
                  <div className="space-y-3 text-xs">
                    <div>
                      <label className="font-bold block mb-1">Nome da Loja:</label>
                      <input type="text" defaultValue={currentStore.name} className="w-full px-3 py-2 border rounded-xl" />
                    </div>
                    <div>
                      <label className="font-bold block mb-1">Telefone / WhatsApp:</label>
                      <input type="text" defaultValue={currentStore.phone} className="w-full px-3 py-2 border rounded-xl" />
                    </div>
                    <div>
                      <label className="font-bold block mb-1">Localização em Angola:</label>
                      <input type="text" defaultValue={currentStore.location + ', ' + currentStore.province} className="w-full px-3 py-2 border rounded-xl" />
                    </div>
                    <div>
                      <label className="font-bold block mb-1">IBAN para Repasses:</label>
                      <input type="text" defaultValue={currentStore.iban} className="w-full font-mono px-3 py-2 border rounded-xl" />
                    </div>
                    <button
                      onClick={() => showToast('Configurações da loja salvas com sucesso!')}
                      className="w-full py-2.5 bg-[#E98A9A] hover:bg-[#C95F72] text-white font-bold rounded-xl mt-4"
                    >
                      Gravar Dados
                    </button>
                  </div>
                </div>
              )}
            </main>
          </div>

          {/* RECEIPT VIEWER MODAL */}
          {viewingReceiptOrder && (
            <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-2xl w-full p-6 space-y-4">
                <div className="flex justify-between items-center pb-3 border-b border-[#F0E5E8]">
                  <h3 className="font-bold text-sm">Comprovativo da Encomenda #{viewingReceiptOrder.id.slice(-5)}</h3>
                  <button onClick={() => setViewingReceiptOrder(null)} className="text-lg font-bold">✕</button>
                </div>
                <img src={viewingReceiptOrder.receipt.url} className="w-full max-h-80 object-contain rounded-xl border" />
                <div className="text-xs flex justify-between bg-[#FFF8FA] p-3 rounded-xl">
                  <span>Total: <strong>{formatKz(viewingReceiptOrder.total)}</strong></span>
                  <span>Ref: <strong className="font-mono">{viewingReceiptOrder.paymentReference}</strong></span>
                  <span>Cliente: <strong>{viewingReceiptOrder.customer.fullName}</strong></span>
                </div>
                {role === 'admin' && viewingReceiptOrder.status === 'payment-review' && (
                  <div className="flex gap-2 pt-2 border-t border-[#F0E5E8]">
                    <button onClick={() => handleValidatePayment(viewingReceiptOrder.id, false)} className="flex-1 py-2 bg-[#FEE2E2] text-[#DC2626] font-bold rounded-xl text-xs">
                      Rejeitar
                    </button>
                    <button onClick={() => handleValidatePayment(viewingReceiptOrder.id, true)} className="flex-1 py-2 bg-[#E98A9A] text-white font-bold rounded-xl text-xs">
                      Aprovar Pagamento
                    </button>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* NEW PRODUCT MODAL */}
          {productModalOpen && (
            <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-lg w-full p-6 space-y-4">
                <div className="flex justify-between items-center pb-2 border-b border-[#F0E5E8]">
                  <h3 className="font-bold text-sm">Publicar Nova Peça · {currentStore.name}</h3>
                  <button onClick={() => setProductModalOpen(false)} className="text-lg font-bold">✕</button>
                </div>
                <form onSubmit={(e) => {
                  e.preventDefault();
                  const form = e.target;
                  handleAddProduct({
                    name: form.pname.value,
                    description: form.pdesc.value,
                    price: Number(form.pprice.value),
                    category: form.pcat.value,
                    condition: form.pcond.value,
                    stock: Number(form.pstock.value),
                    sizes: ['S', 'M', 'L'],
                    colors: ['#E98A9A'],
                    image: form.pimg.value || 'https://images.unsplash.com/photo-1515372039744-b8f02a3ae446?w=600',
                    merchantId: activeStoreId,
                    merchantStoreName: currentStore.name,
                  });
                }} className="space-y-3 text-xs">
                  <div>
                    <label className="font-bold block mb-1">Nome da Peça:</label>
                    <input name="pname" required placeholder="Ex: Vestido Estampado" className="w-full px-3 py-2 border rounded-xl" />
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="font-bold block mb-1">Preço em Kwanzas (Kz):</label>
                      <input name="pprice" type="number" required defaultValue="15000" className="w-full px-3 py-2 border rounded-xl" />
                    </div>
                    <div>
                      <label className="font-bold block mb-1">Stock Inicial:</label>
                      <input name="pstock" type="number" required defaultValue="5" className="w-full px-3 py-2 border rounded-xl" />
                    </div>
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="font-bold block mb-1">Categoria:</label>
                      <select name="pcat" className="w-full px-3 py-2 border rounded-xl">
                        <option value="vestidos">Vestidos</option>
                        <option value="tops">Tops & Camisas</option>
                        <option value="saias">Saias</option>
                        <option value="calcado">Calçado</option>
                      </select>
                    </div>
                    <div>
                      <label className="font-bold block mb-1">Condição:</label>
                      <select name="pcond" className="w-full px-3 py-2 border rounded-xl">
                        <option value="new">Novo (Com etiqueta)</option>
                        <option value="semi-new">Seminovo</option>
                        <option value="good-used">Segunda mão</option>
                      </select>
                    </div>
                  </div>
                  <div>
                    <label className="font-bold block mb-1">URL da Imagem:</label>
                    <input name="pimg" placeholder="https://..." defaultValue="https://images.unsplash.com/photo-1515372039744-b8f02a3ae446?w=600" className="w-full px-3 py-2 border rounded-xl" />
                  </div>
                  <div>
                    <label className="font-bold block mb-1">Descrição:</label>
                    <textarea name="pdesc" placeholder="Detalhes do tecido..." className="w-full px-3 py-2 border rounded-xl" rows="2"></textarea>
                  </div>
                  <div className="pt-2 flex justify-end gap-2">
                    <button type="button" onClick={() => setProductModalOpen(false)} className="px-4 py-2 border rounded-xl">Cancelar</button>
                    <button type="submit" className="px-4 py-2 bg-[#E98A9A] text-white font-bold rounded-xl">Publicar</button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
